<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cafeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="100%" stop-color="#F2EDE4" />
    </linearGradient>
    <filter id="cafeShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#063F32" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#cafeBg)" />

  <!-- Modern Restaurant Website & Booking Interface Mockup -->
  <g transform="translate(60, 45)" filter="url(#cafeShadow)">
    <rect width="680" height="410" rx="14" fill="#FFFFFF" stroke="#E5DEC9" stroke-width="1.5" />
    
    <!-- Browser Nav Bar -->
    <rect width="680" height="44" rx="14" fill="#FCFAF6" />
    <path d="M0 44 h680" stroke="#E5DEC9" stroke-width="1" />
    
    <circle cx="24" cy="22" r="5" fill="#EF4444" opacity="0.7" />
    <circle cx="39" cy="22" r="5" fill="#F59E0B" opacity="0.7" />
    <circle cx="54" cy="22" r="5" fill="#10B981" opacity="0.7" />
    
    <!-- URL -->
    <rect x="80" y="11" width="300" height="22" rx="6" fill="#FFFFFF" stroke="#E5DEC9" />
    <text x="96" y="26" font-family="sans-serif" font-size="11" fill="#78716C">harvestrootscafe.in/reserve-table</text>
    
    <!-- Table Status Indicator -->
    <rect x="520" y="11" width="140" height="22" rx="6" fill="#E8F5EA" />
    <circle cx="534" cy="22" r="3.5" fill="#168B46" />
    <text x="544" y="25" font-family="sans-serif" font-size="10" font-weight="700" fill="#168B46">LIVE ONLINE BOOKINGS</text>

    <!-- Website Hero & Reservation Engine Simulation -->
    <g transform="translate(30, 65)">
      <!-- Left: Restaurant Hero Image & Brand Banner -->
      <g>
        <rect width="360" height="320" rx="10" fill="#292524" />
        <rect width="360" height="320" rx="10" fill="#063F32" opacity="0.85" />
        <text x="24" y="45" font-family="'Times New Roman', serif" font-size="28" font-weight="700" fill="#FFFFFF">Harvest Roots</text>
        <text x="24" y="70" font-family="'Times New Roman', serif" font-size="20" font-style="italic" fill="#C5DEC9">Farm-to-Cup Artisan Cafe</text>
        
        <!-- Feature Highlights -->
        <g transform="translate(24, 110)">
          <rect width="310" height="60" rx="8" fill="#FFFFFF" opacity="0.1" />
          <text x="16" y="26" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">ORGANIC COFFEE &amp; SOURDOUGH</text>
          <text x="16" y="44" font-family="sans-serif" font-size="10" fill="#E8F5EA">Locally sourced beans from Kodaikanal hills.</text>
        </g>

        <!-- Metrics pill -->
        <g transform="translate(24, 190)">
          <rect width="310" height="95" rx="8" fill="#04261E" stroke="#168B46" stroke-width="1" />
          <text x="16" y="24" font-family="sans-serif" font-size="10" font-weight="800" fill="#84CC16">CONVERSION IMPACT</text>
          <text x="16" y="52" font-family="sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">+240% Table Bookings</text>
          <text x="16" y="75" font-family="sans-serif" font-size="10" fill="#C8E6C9">Integrated QR Menu &amp; Direct WhatsApp Checkout</text>
        </g>
      </g>

      <!-- Right: Real-Time Table Reservation Widget -->
      <g transform="translate(380, 0)">
        <rect width="240" height="320" rx="10" fill="#FAF8F5" stroke="#E5DEC9" stroke-width="1" />
        <text x="20" y="32" font-family="sans-serif" font-size="13" font-weight="800" fill="#063F32">Reserve a Table</text>
        <text x="20" y="48" font-family="sans-serif" font-size="10" fill="#78716C">Instant Confirmation in 30s</text>

        <!-- Date selector -->
        <text x="20" y="78" font-family="sans-serif" font-size="10" font-weight="700" fill="#44403C">SELECT DATE</text>
        <rect x="20" y="86" width="200" height="32" rx="6" fill="#FFFFFF" stroke="#D6D3D1" />
        <text x="32" y="106" font-family="sans-serif" font-size="11" fill="#1C1917">Today, Oct 31 • Dinner</text>

        <!-- Guests Selector -->
        <text x="20" y="140" font-family="sans-serif" font-size="10" font-weight="700" fill="#44403C">PARTY SIZE</text>
        <g transform="translate(20, 148)">
          <rect width="45" height="28" rx="6" fill="#FFFFFF" stroke="#D6D3D1" />
          <text x="22" y="18" font-family="sans-serif" font-size="11" fill="#44403C" text-anchor="middle">2</text>
          <rect x="52" y="0" width="45" height="28" rx="6" fill="#168B46" />
          <text x="74" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
          <rect x="104" y="0" width="45" height="28" rx="6" fill="#FFFFFF" stroke="#D6D3D1" />
          <text x="126" y="18" font-family="sans-serif" font-size="11" fill="#44403C" text-anchor="middle">6</text>
          <rect x="156" y="0" width="44" height="28" rx="6" fill="#FFFFFF" stroke="#D6D3D1" />
          <text x="178" y="18" font-family="sans-serif" font-size="11" fill="#44403C" text-anchor="middle">8+</text>
        </g>

        <!-- Seating Preference -->
        <text x="20" y="200" font-family="sans-serif" font-size="10" font-weight="700" fill="#44403C">SEATING</text>
        <rect x="20" y="208" width="200" height="30" rx="6" fill="#E8F5EA" stroke="#168B46" />
        <text x="32" y="227" font-family="sans-serif" font-size="10" font-weight="700" fill="#168B46">✓ Outdoor Garden Courtyard</text>

        <!-- Book Button -->
        <rect x="20" y="258" width="200" height="38" rx="8" fill="#063F32" />
        <text x="120" y="282" font-family="sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">Confirm Reservation →</text>
      </g>
    </g>
  </g>
</svg>

