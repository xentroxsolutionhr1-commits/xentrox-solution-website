<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="novaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6FAF7" />
      <stop offset="100%" stop-color="#EBF4EE" />
    </linearGradient>
    <filter id="novaShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#063F32" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#novaBg)" />

  <!-- Multi-channel Ad Funnel Dashboard Mockup -->
  <g transform="translate(60, 45)" filter="url(#novaShadow)">
    <rect width="680" height="410" rx="14" fill="#FFFFFF" stroke="#E2EBE5" stroke-width="1.5" />
    
    <!-- Top Header Bar -->
    <rect width="680" height="46" rx="14" fill="#F8FAF8" />
    <path d="M0 46 h680" stroke="#E2EBE5" stroke-width="1" />
    <circle cx="25" cy="23" r="5" fill="#EF4444" opacity="0.7" />
    <circle cx="40" cy="23" r="5" fill="#F59E0B" opacity="0.7" />
    <circle cx="55" cy="23" r="5" fill="#10B981" opacity="0.7" />
    <text x="80" y="27" font-family="sans-serif" font-size="12" font-weight="800" fill="#063F32">NOVA REALTY — Meta &amp; Google Ads Funnel Optimization</text>
    
    <rect x="520" y="12" width="140" height="22" rx="6" fill="#E8F5EA" />
    <text x="590" y="26" font-family="sans-serif" font-size="10" font-weight="700" fill="#168B46" text-anchor="middle">ACTIVE CAMPAIGNS (12)</text>

    <!-- Funnel Metrics Overview -->
    <g transform="translate(30, 65)">
      <!-- Metric 1: Cost Per Lead -->
      <rect width="185" height="85" rx="10" fill="#FBFDFB" stroke="#E2EBE5" stroke-width="1.2" />
      <text x="16" y="26" font-family="sans-serif" font-size="10" font-weight="800" fill="#64748B" letter-spacing="0.5">AVERAGE CPL</text>
      <text x="16" y="58" font-family="sans-serif" font-size="24" font-weight="900" fill="#063F32">₹340 <tspan font-size="14" font-weight="600" fill="#168B46">(-58%)</tspan></text>
      <text x="16" y="74" font-family="sans-serif" font-size="9" fill="#168B46">Reduced from ₹810 / lead</text>

      <!-- Metric 2: Qualified Buyer Leads -->
      <g transform="translate(205, 0)">
        <rect width="185" height="85" rx="10" fill="#FBFDFB" stroke="#E2EBE5" stroke-width="1.2" />
        <text x="16" y="26" font-family="sans-serif" font-size="10" font-weight="800" fill="#64748B" letter-spacing="0.5">QUALIFIED SITE VISITS</text>
        <text x="16" y="58" font-family="sans-serif" font-size="24" font-weight="900" fill="#063F32">1,842</text>
        <text x="16" y="74" font-family="sans-serif" font-size="9" fill="#168B46">+146% High-Intent Buyers</text>
      </g>

      <!-- Metric 3: Return on Ad Spend (ROAS) -->
      <g transform="translate(410, 0)">
        <rect width="210" height="85" rx="10" fill="#FBFDFB" stroke="#E2EBE5" stroke-width="1.2" />
        <text x="16" y="26" font-family="sans-serif" font-size="10" font-weight="800" fill="#64748B" letter-spacing="0.5">EST. PIPELINE VALUE</text>
        <text x="16" y="58" font-family="sans-serif" font-size="24" font-weight="900" fill="#063F32">₹42.8 Cr</text>
        <text x="16" y="74" font-family="sans-serif" font-size="9" fill="#168B46">ROAS Multiplier: 9.2x</text>
      </g>
    </g>

    <!-- Funnel Conversion Stages Visual -->
    <g transform="translate(30, 175)">
      <rect width="620" height="205" rx="10" fill="#FFFFFF" stroke="#E2EBE5" />
      <text x="20" y="26" font-family="sans-serif" font-size="12" font-weight="800" fill="#063F32">Full-Funnel Paid Acquisition Flow</text>

      <!-- Funnel Bar 1: Impressions -->
      <g transform="translate(20, 45)">
        <rect width="580" height="28" rx="6" fill="#F1F8F3" />
        <rect width="580" height="28" rx="6" fill="#063F32" opacity="0.9" />
        <text x="16" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">1. Target Impressions: High-Net-Worth Demographics (1.4M Reach)</text>
      </g>

      <!-- Funnel Bar 2: High Intent Clicks -->
      <g transform="translate(20, 85)">
        <rect width="580" height="28" rx="6" fill="#F1F8F3" />
        <rect width="440" height="28" rx="6" fill="#168B46" />
        <text x="16" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">2. High-Intent Traffic: Search Ads &amp; Virtual Walkthroughs (42,600 Clicks)</text>
      </g>

      <!-- Funnel Bar 3: Instant Enquiries -->
      <g transform="translate(20, 125)">
        <rect width="580" height="28" rx="6" fill="#F1F8F3" />
        <rect width="310" height="28" rx="6" fill="#15803D" />
        <text x="16" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">3. Verified Lead Enquiries (4,820 Form Submissions)</text>
      </g>

      <!-- Funnel Bar 4: Site Bookings -->
      <g transform="translate(20, 165)">
        <rect width="580" height="28" rx="6" fill="#F1F8F3" />
        <rect width="180" height="28" rx="6" fill="#84CC16" />
        <text x="16" y="18" font-family="sans-serif" font-size="11" font-weight="800" fill="#063F32">4. Direct Site Tours Scheduled (1,842 Bookings)</text>
      </g>
    </g>
  </g>
</svg>

