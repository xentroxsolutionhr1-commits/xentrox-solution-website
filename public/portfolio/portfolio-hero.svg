<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="100%" height="100%">
  <defs>
    <linearGradient id="heroShowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F5EA" />
      <stop offset="100%" stop-color="#D6EEDB" />
    </linearGradient>
    <filter id="layerShadow" x="-15%" y="-10%" width="130%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#063F32" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <rect width="640" height="480" rx="20" fill="url(#heroShowBg)" opacity="0.6" />

  <!-- Back Layer Card: Fleet App -->
  <g transform="translate(140, 30) rotate(5)" filter="url(#layerShadow)">
    <rect width="440" height="260" rx="14" fill="#063F32" stroke="#168B46" stroke-width="1.5" />
    <!-- Mini dark header -->
    <rect width="440" height="32" rx="14" fill="#04261E" />
    <circle cx="20" cy="16" r="4" fill="#EF4444" opacity="0.7" />
    <circle cx="32" cy="16" r="4" fill="#F59E0B" opacity="0.7" />
    <circle cx="44" cy="16" r="4" fill="#10B981" opacity="0.7" />
    <text x="60" y="20" font-family="sans-serif" font-size="10" font-weight="700" fill="#34D399">FLOWLINE LOGISTICS • FLEET ENGINE</text>
    <!-- Map line simulation -->
    <path d="M 40 180 Q 140 120 220 150 T 380 90" fill="none" stroke="#34D399" stroke-width="3" stroke-dasharray="6 4" />
    <circle cx="220" cy="150" r="8" fill="#FBBF24" />
    <!-- Stat card -->
    <rect x="260" y="140" width="150" height="60" rx="8" fill="#042F25" />
    <text x="274" y="165" font-family="sans-serif" font-size="9" fill="#94A3B8">DISPATCH EFFICIENCY</text>
    <text x="274" y="188" font-family="sans-serif" font-size="16" font-weight="900" fill="#34D399">99.4% LIVE</text>
  </g>

  <!-- Middle Main Layer: Clean Organic Analytics Dashboard -->
  <g transform="translate(40, 110)" filter="url(#layerShadow)">
    <rect width="480" height="300" rx="16" fill="#FFFFFF" stroke="#E2EBE5" stroke-width="1.5" />
    <!-- Browser Top Bar -->
    <rect width="480" height="36" rx="16" fill="#F8FAF8" />
    <path d="M0 36 h480" stroke="#E2EBE5" stroke-width="1" />
    <circle cx="20" cy="18" r="4" fill="#EF4444" opacity="0.7" />
    <circle cx="32" cy="18" r="4" fill="#F59E0B" opacity="0.7" />
    <circle cx="44" cy="18" r="4" fill="#10B981" opacity="0.7" />
    <rect x="65" y="8" width="220" height="20" rx="5" fill="#FFFFFF" stroke="#E2EBE5" />
    <text x="75" y="22" font-family="sans-serif" font-size="9" fill="#64748B">xentroxsolutions.com/portfolio-showcase</text>
    <rect x="360" y="8" width="105" height="20" rx="5" fill="#E8F5EA" />
    <text x="412" y="22" font-family="sans-serif" font-size="9" font-weight="700" fill="#168B46" text-anchor="middle">ACTIVE CLIENTS</text>

    <!-- Content: Analytics Chart & Metrics -->
    <g transform="translate(20, 50)">
      <!-- Left Metric Box -->
      <rect width="130" height="65" rx="8" fill="#FBFDFB" stroke="#E8F5EA" />
      <text x="12" y="22" font-family="sans-serif" font-size="9" font-weight="700" fill="#64748B">ORGANIC SESSIONS</text>
      <text x="12" y="46" font-family="sans-serif" font-size="18" font-weight="900" fill="#063F32">+314%</text>

      <!-- Right Metric Box -->
      <g transform="translate(145, 0)">
        <rect width="130" height="65" rx="8" fill="#FBFDFB" stroke="#E8F5EA" />
        <text x="12" y="22" font-family="sans-serif" font-size="9" font-weight="700" fill="#64748B">AVERAGE ROAS</text>
        <text x="12" y="46" font-family="sans-serif" font-size="18" font-weight="900" fill="#168B46">9.2x High CPL</text>
      </g>

      <!-- Badge Pill -->
      <g transform="translate(290, 0)">
        <rect width="145" height="65" rx="8" fill="#063F32" />
        <text x="14" y="26" font-family="sans-serif" font-size="9" font-weight="700" fill="#A3E635">STUDIO SHIPPED</text>
        <text x="14" y="48" font-family="sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Strategy + Code</text>
      </g>

      <!-- Chart Simulation -->
      <g transform="translate(0, 80)">
        <rect width="440" height="150" rx="10" fill="#FBFDFB" stroke="#E2EBE5" />
        <path d="M 15 110 C 80 100, 140 85, 200 65 C 260 45, 340 30, 420 15 L 420 135 L 15 135 Z" fill="#168B46" opacity="0.12" />
        <path d="M 15 110 C 80 100, 140 85, 200 65 C 260 45, 340 30, 420 15" fill="none" stroke="#168B46" stroke-width="3" stroke-linecap="round" />
        <circle cx="420" cy="15" r="5" fill="#168B46" stroke="#FFFFFF" stroke-width="2" />
        <text x="20" y="30" font-family="sans-serif" font-size="11" font-weight="800" fill="#063F32">Conversion &amp; Revenue Compounding</text>
      </g>
    </g>
  </g>

  <!-- Front Floating Mobile Mockup: CityTiffin App -->
  <g transform="translate(420, 210)" filter="url(#layerShadow)">
    <rect width="180" height="250" rx="24" fill="#1E293B" />
    <rect x="5" y="5" width="170" height="240" rx="20" fill="#FFFFFF" />
    <rect x="60" y="10" width="60" height="12" rx="6" fill="#1E293B" />
    
    <g transform="translate(14, 30)">
      <text x="0" y="12" font-family="sans-serif" font-size="8" font-weight="700" fill="#168B46">CITYTIFFIN</text>
      <text x="0" y="26" font-family="sans-serif" font-size="11" font-weight="900" fill="#063F32">Order En Route</text>
      <rect x="0" y="34" width="142" height="60" rx="8" fill="#E8F5EA" />
      <circle cx="20" cy="54" r="6" fill="#168B46" />
      <text x="32" y="50" font-family="sans-serif" font-size="9" font-weight="800" fill="#063F32">Driver 8 mins away</text>
      <text x="32" y="64" font-family="sans-serif" font-size="8" fill="#168B46">Live GPS Geofence</text>

      <rect x="0" y="105" width="142" height="40" rx="6" fill="#F8FAF8" stroke="#E2EBE5" />
      <text x="10" y="122" font-family="sans-serif" font-size="8" font-weight="700" fill="#063F32">React Native + Node</text>
      <text x="10" y="135" font-family="sans-serif" font-size="7" fill="#64748B">Cross-Platform iOS &amp; Android</text>
    </g>
  </g>
</svg>

